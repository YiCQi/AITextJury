<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AITextJury — open workbench for AI text detection</title>
    <meta name="description" content="Run multiple AI-text detectors side by side, see the evidence — heatmaps, perplexity, calibration, consensus — instead of a single opaque AI-percentage." />
    <script>
      // theme pre-mount: saved choice wins, else OS preference, else dark.
      // Runs before React mounts to avoid a flash of the wrong mode.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t === "dark" || t === "light"
            ? t === "dark"
            : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230e1420'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%2321c993' stroke-width='2.5'/%3E%3Ccircle cx='27' cy='16' r='2.5' fill='%23f0a35c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
