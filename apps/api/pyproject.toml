[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroaibench"
version = "0.1.0"
description = "ZeroAIBench — an open workbench for AI-generated text detection. Evidence, not verdicts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ZeroAIBench contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local ML detectors: LLM Perplexity / Fast-DetectGPT / Binoculars / HF classifiers
ml = [
    "torch>=2.1",
    "transformers>=4.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/zeroaibench/zeroaibench"

[tool.setuptools.packages.find]
include = ["zeroaibench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
